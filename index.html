<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Ami Fossils</title>
  
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/player.css">
  <link rel="stylesheet" href="css/concert.css">
  <link rel="stylesheet" href="css/effects.css">
  <link rel="stylesheet" href="css/responsive.css">
  
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  
  <div id="lighters-container">
    <div class="lighter" style="left:0vw; top:20vh; animation-delay: -0.0s"></div>
    <div class="lighter" style="left:5vw; top:30vh; animation-delay: -0.2s"></div>
    <div class="lighter" style="left:10vw; top:40vh; animation-delay: -0.4s"></div>
    <div class="lighter" style="left:15vw; top:50vh; animation-delay: -0.6s"></div>
    <div class="lighter" style="left:20vw; top:60vh; animation-delay: -0.8s"></div>
    <div class="lighter" style="left:25vw; top:20vh; animation-delay: -1.0s"></div>
    <div class="lighter" style="left:30vw; top:30vh; animation-delay: -1.2s"></div>
    <div class="lighter" style="left:35vw; top:40vh; animation-delay: -1.4s"></div>
    <div class="lighter" style="left:40vw; top:50vh; animation-delay: -1.6s"></div>
    <div class="lighter" style="left:45vw; top:60vh; animation-delay: -1.8s"></div>
    <div class="lighter" style="left:50vw; top:20vh; animation-delay: -2.0s"></div>
    <div class="lighter" style="left:55vw; top:30vh; animation-delay: -2.2s"></div>
    <div class="lighter" style="left:60vw; top:40vh; animation-delay: -2.4s"></div>
    <div class="lighter" style="left:65vw; top:50vh; animation-delay: -2.6s"></div>
    <div class="lighter" style="left:70vw; top:60vh; animation-delay: -2.8s"></div>
    <div class="lighter" style="left:75vw; top:20vh; animation-delay: -3.0s"></div>
    <div class="lighter" style="left:80vw; top:30vh; animation-delay: -3.2s"></div>
    <div class="lighter" style="left:85vw; top:40vh; animation-delay: -3.4s"></div>
    <div class="lighter" style="left:90vw; top:50vh; animation-delay: -3.6s"></div>
    <div class="lighter" style="left:95vw; top:60vh; animation-delay: -3.8s"></div>
  </div>
  
  <div id="blackout-screen"></div>
  
  <div class="concert-lights">
    <div class="light-beam beam-1"></div>
    <div class="light-beam beam-2"></div>
    <div class="light-beam beam-3"></div>
    <div class="light-beam beam-4"></div>
  </div>

  <div class="top-bar">
    <div class="top-left">
      <div class="stage-controls">
        <button class="control-btn" id="lighter-btn">🕯️ Lighters</button>
        <button class="control-btn" id="overdrive-btn">🎛️ Overdrive</button>
        <button class="control-btn" id="encore-btn" style="background:#ff4757; border-color:#ff4757;">🎸 ENCORE</button>
      </div>
    </div>
    <div class="top-center">
      <div class="status-pill"><span class="dot"></span> VIRTUAL CONCERT</div>
    </div>
    <div class="top-right"></div>
  </div>

  <div class="bottom-bar">
    <div class="bottom-left">
      <button class="share-btn" id="share-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        Share with your friend
      </button>
    </div>
    <div class="bottom-right">
      <button class="action-btn" id="clap-btn" aria-label="Clap" title="Clapping Sound">👏</button>
      <button class="action-btn" id="dialogue-btn" aria-label="Dialogue" title="Coming Soon" disabled style="opacity: 0.5; cursor: not-allowed;">🎤</button>
      <button class="action-btn" id="cheer-btn" aria-label="Cheer" title="Crowd Cheer">🗣️</button>
      <button class="action-btn" id="popper-btn" aria-label="Party Poppers" title="Party Poppers">🎉</button>
    </div>
  </div>

  <audio id="audio-player" preload="metadata"></audio>

  <div class="player-wrap">
    <div id="eq-visualizer">
      <div class="eq-bar" style="animation-duration:0.4s"></div>
      <div class="eq-bar" style="animation-duration:0.6s"></div>
      <div class="eq-bar" style="animation-duration:0.3s"></div>
      <div class="eq-bar" style="animation-duration:0.7s"></div>
      <div class="eq-bar" style="animation-duration:0.5s"></div>
      <div class="eq-bar" style="animation-duration:0.65s"></div>
      <div class="eq-bar" style="animation-duration:0.35s"></div>
      <div class="eq-bar" style="animation-duration:0.55s"></div>
      <div class="eq-bar" style="animation-duration:0.45s"></div>
      <div class="eq-bar" style="animation-duration:0.7s"></div>
    </div>
    <div class="player-pill">
      <div class="player-top">
        <div class="art-wrap">
          <div class="vinyl" id="vinyl"></div>
          <img class="art-img" id="art-img" src="" alt="Album art">
        </div>
        <div class="track-info">
          <div class="track-title" id="track-title">Loading...</div>
          <div class="time-label" id="time-label">0:00 / 0:00</div>
        </div>
        <div class="controls">
          <button class="play-btn" id="play-btn" aria-label="Play or pause">
            <svg id="play-icon" viewBox="0 0 24 24" fill="black"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pause-icon" viewBox="0 0 24 24" fill="black" style="display:none;"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          </button>
        </div>
      </div>
      <div class="progress-track" id="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <button class="shuffle-btn" id="shuffle-btn" aria-label="Shuffle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 3 21 3 21 8"></polyline>
        <line x1="4" y1="20" x2="21" y2="3"></line>
        <polyline points="21 16 21 21 16 21"></polyline>
        <line x1="15" y1="15" x2="21" y2="21"></line>
        <line x1="4" y1="4" x2="9" y2="9"></line>
      </svg>
    </button>
  </div>

  <script src="js/playlist.js"></script>
  <script src="js/player.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/soundboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
