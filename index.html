<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Ami Fossils</title>
  
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/player.css">
  <link rel="stylesheet" href="assets/css/concert.css">
  <link rel="stylesheet" href="assets/css/effects.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  
  <div id="lighters-container">
    <!-- Scattered crowd phone flashlights / lighters -->
    <div class="lighter" style="left: 12vw; top: 75vh; animation-delay: -0.1s; transform: scale(0.6)"></div>
    <div class="lighter" style="left: 28vw; top: 62vh; animation-delay: -1.4s; transform: scale(0.8)"></div>
    <div class="lighter" style="left: 45vw; top: 80vh; animation-delay: -0.7s; transform: scale(0.5)"></div>
    <div class="lighter" style="left: 65vw; top: 55vh; animation-delay: -2.3s; transform: scale(0.7)"></div>
    <div class="lighter" style="left: 88vw; top: 68vh; animation-delay: -1.1s; transform: scale(0.9)"></div>
    <div class="lighter" style="left: 5vw; top: 50vh; animation-delay: -0.9s; transform: scale(0.5)"></div>
    <div class="lighter" style="left: 35vw; top: 85vh; animation-delay: -2.7s; transform: scale(0.6)"></div>
    <div class="lighter" style="left: 55vw; top: 70vh; animation-delay: -0.4s; transform: scale(0.8)"></div>
    <div class="lighter" style="left: 78vw; top: 60vh; animation-delay: -3.2s; transform: scale(0.4)"></div>
    <div class="lighter" style="left: 92vw; top: 82vh; animation-delay: -1.8s; transform: scale(0.7)"></div>
    <div class="lighter" style="left: 20vw; top: 58vh; animation-delay: -0.5s; transform: scale(0.5)"></div>
    <div class="lighter" style="left: 42vw; top: 65vh; animation-delay: -2.1s; transform: scale(0.9)"></div>
    <div class="lighter" style="left: 60vw; top: 88vh; animation-delay: -1.5s; transform: scale(0.6)"></div>
    <div class="lighter" style="left: 82vw; top: 75vh; animation-delay: -0.8s; transform: scale(0.8)"></div>
    <div class="lighter" style="left: 15vw; top: 82vh; animation-delay: -3.5s; transform: scale(0.7)"></div>
    <div class="lighter" style="left: 50vw; top: 52vh; animation-delay: -1.2s; transform: scale(0.5)"></div>
    <div class="lighter" style="left: 72vw; top: 85vh; animation-delay: -0.3s; transform: scale(0.8)"></div>
    <div class="lighter" style="left: 8vw; top: 65vh; animation-delay: -2.8s; transform: scale(0.6)"></div>
    <div class="lighter" style="left: 95vw; top: 50vh; animation-delay: -1.9s; transform: scale(0.4)"></div>
    <div class="lighter" style="left: 32vw; top: 72vh; animation-delay: -0.6s; transform: scale(0.7)"></div>
  </div>
  
  <div id="blackout-screen"></div>
  
  <div class="concert-lights">
    <div class="light-beam beam-1"></div>
    <div class="light-beam beam-2"></div>
    <div class="light-beam beam-3"></div>
    <div class="light-beam beam-4"></div>
  </div>

  <div class="top-bar">
    <div class="top-left">
      <div class="stage-controls">
        <button class="control-btn" id="lighter-btn">Lighters</button>
        <button class="control-btn" id="eq-toggle-btn">Equalizer</button>
      </div>
    </div>
    <div class="top-center">
    </div>
    <div class="top-right"></div>
  </div>

  <div class="bottom-bar">
    <div class="bottom-left" style="font-size: 14px; font-weight: 500; color: rgba(255, 255, 255, 0.7); letter-spacing: 0.5px; padding-left: 10px;">
      Made with <span style="color: #ff4757;">♥</span> by Arnab
    </div>
    <div class="bottom-right">
      <button class="action-btn" id="clap-btn" aria-label="Clap" title="Clapping Sound">👏</button>
      <button class="action-btn" id="dialogue-btn" aria-label="Dialogue" title="Mic Sound">🎤</button>
      <button class="action-btn" id="cheer-btn" aria-label="Cheer" title="Crowd Cheer">🗣️</button>
      <button class="action-btn" id="popper-btn" aria-label="Party Poppers" title="Party Poppers">🎉</button>
    </div>
  </div>

  <audio id="audio-player" preload="metadata"></audio>

  <div class="player-wrap">
  
    <!-- EQ Panel -->
    <div class="eq-panel" id="eq-panel">
      <div class="eq-header">
        <span class="eq-title">EQUALIZER</span>
        <select id="eq-preset-select" class="eq-presets">
          <option value="flat">Flat</option>
          <option value="rock">Rock</option>
          <option value="bass">Bass Boost</option>
          <option value="vocal">Vocal</option>
        </select>
      </div>
      <div class="eq-sliders">
        <div class="eq-band"><span class="eq-value">0 dB</span><input type="range" min="-12" max="12" value="0" class="eq-slider" data-freq="60"><label>60 Hz</label></div>
        <div class="eq-band"><span class="eq-value">0 dB</span><input type="range" min="-12" max="12" value="0" class="eq-slider" data-freq="150"><label>150 Hz</label></div>
        <div class="eq-band"><span class="eq-value">0 dB</span><input type="range" min="-12" max="12" value="0" class="eq-slider" data-freq="400"><label>400 Hz</label></div>
        <div class="eq-band"><span class="eq-value">0 dB</span><input type="range" min="-12" max="12" value="0" class="eq-slider" data-freq="1000"><label>1 kHz</label></div>
        <div class="eq-band"><span class="eq-value">0 dB</span><input type="range" min="-12" max="12" value="0" class="eq-slider" data-freq="2400"><label>2.4 kHz</label></div>
        <div class="eq-band"><span class="eq-value">0 dB</span><input type="range" min="-12" max="12" value="0" class="eq-slider" data-freq="6000"><label>6 kHz</label></div>
        <div class="eq-band"><span class="eq-value">0 dB</span><input type="range" min="-12" max="12" value="0" class="eq-slider" data-freq="12000"><label>12 kHz</label></div>
      </div>
    </div>
    <div class="player-pill">
      <div class="player-top">
        <div class="player-info-section">
          <div class="art-wrap">
            <div class="vinyl" id="vinyl"></div>
            <div class="art-placeholder" id="art-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
            </div>
            <img class="art-img" id="art-img" src="" alt="Album art" style="display: none;">
          </div>
          
          <div class="track-info">
            <div class="track-title" id="track-title">Loading...</div>
            <div class="track-meta">
              <span class="track-artist" id="track-artist">Artist</span>
              <span class="track-separator">•</span>
              <span class="track-album" id="track-album">Album Name</span>
            </div>
          </div>
        </div>

        <div class="controls-section">
          <div class="controls">
            <button class="ctrl-btn" id="like-btn" title="Like">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            </button>
            <button class="ctrl-btn" id="shuffle-btn" title="Shuffle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
            </button>
            <button class="ctrl-btn" id="prev-btn" title="Previous">
              <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line></svg>
            </button>
            
            <button class="play-btn" id="play-btn" aria-label="Play or pause">
              <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
              <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
            </button>
            
            <button class="ctrl-btn" id="next-btn" title="Next">
              <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line></svg>
            </button>
            <button class="ctrl-btn" id="repeat-btn" title="Repeat">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
            </button>
          </div>
        </div>
      </div>
      
      <div class="player-bottom">
        <span class="time-current" id="time-current">0:00</span>
        <div class="progress-track" id="progress-track">
          <div class="progress-fill" id="progress-fill">
            <div class="progress-thumb"></div>
          </div>
        </div>
        <span class="time-duration" id="time-duration">0:00</span>
      </div>
    </div>
  </div>

  <script src="assets/js/playlist.js"></script>
  <script src="assets/js/player.js"></script>
  <script src="assets/js/effects.js"></script>
  <script src="assets/js/soundboard.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
